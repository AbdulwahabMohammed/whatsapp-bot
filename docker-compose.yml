version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-password}
      POSTGRES_DB: ${PGDATABASE:-whatsapp_bot}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PGUSER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      APP_PORT: ${APP_PORT:-3001}
      ADMIN_PORT: ${APP_PORT:-3001}
      PGHOST: db
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-password}
      PGDATABASE: ${PGDATABASE:-whatsapp_bot}
      PGPORT: ${PGPORT:-5432}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      WHATSAPP_AUTH_DIR: /app/whatsapp-auth
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ['sh', '-c', 'npm run migrate && node src/admin.js']
    ports:
      - '${APP_HOST_PORT:-31371}:${APP_PORT:-3001}'
    volumes:
      - ./whatsapp-auth:/app/whatsapp-auth
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- "http://localhost:${APP_PORT:-3001}" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      PGHOST: db
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-password}
      PGDATABASE: ${PGDATABASE:-whatsapp_bot}
      PGPORT: ${PGPORT:-5432}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      WHATSAPP_AUTH_DIR: /app/whatsapp-auth
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ['sh', '-c', 'npm run migrate && node src/worker.js']
    volumes:
      - ./whatsapp-auth:/app/whatsapp-auth
    restart: unless-stopped

  migrate:
    profiles: ['migrate']
    build: .
    env_file: .env
    environment:
      PGHOST: db
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-password}
      PGDATABASE: ${PGDATABASE:-whatsapp_bot}
      PGPORT: ${PGPORT:-5432}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ['npm', 'run', 'migrate']

  frontend:
    build:
      context: ../whatsapp-bot-frontend
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://app:3000}
    depends_on:
      app:
        condition: service_started
    ports:
      - '${FRONTEND_HOST_PORT:-4173}:80'

volumes:
  db-data:
