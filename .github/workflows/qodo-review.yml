name: Save Qodo Review Comments

on:
  pull_request:
    types: [submitted, edited]

jobs:
  save-comments:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}


      - name: Fetch PR comments
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const prNumber = context.payload.pull_request.number;
            const { data: comments } = await github.rest.pulls.listReviewComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const qodoComments = comments.filter(c => c.user.login.includes('qodo'));
            let content = '# Qodo Review Comments\n\n';

            qodoComments.forEach((c, i) => {
              content += `### 🧠 Comment ${i + 1} (line ${c.position})\n`;
              content += `> ${c.body}\n\n`;
              content += `🔗 [View in GitHub](${c.html_url})\n\n`;
            });

            fs.writeFileSync('qodo-review.md', content);

      - name: Commit Qodo comments
        run: |
          git config user.name "qodo-bot"
          git config user.email "qodo@users.noreply.github.com"
          git add qodo-review.md
          git commit -m "📝 Add Qodo review comments"
          git push origin HEAD:${{ github.head_ref }}

