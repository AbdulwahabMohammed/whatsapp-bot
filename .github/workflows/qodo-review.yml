name: Save Qodo Review Comments

on:
  pull_request:
    types: [submitted, edited]

jobs:
  save-comments:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: write

    steps:
      - name: Checkout repository on correct branch
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}

      - name: Append qodo-merge-pro comments to docs/review_notes.md
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const prTitle = pr.title;
            const prBranch = pr.head.ref;
            const currentDate = new Date().toISOString().split('T')[0];

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const qodoComments = comments.filter(c => c.user.login === 'qodo-merge-pro');
            let newContent = `\n\n---\n\n## 🧠 Qodo Review Comments (PR #${prNumber})\n`;
            newContent += `**Title**: ${prTitle}\n\n`;
            newContent += `**Branch**: \`${prBranch}\` &nbsp;&nbsp; 📅 **Date**: ${currentDate}\n\n`;

            if (qodoComments.length === 0) {
              newContent += '_❌ No comments from qodo-merge-pro found._\n';
            } else {
              qodoComments.forEach((c, i) => {
                newContent += `### 💬 Comment ${i + 1}\n\n`;
                newContent += `${c.body}\n\n`;
                newContent += `🔗 [View in GitHub](${c.html_url})\n\n`;
                newContent += `---\n\n`;
              });
            }

            const filePath = path.join(process.cwd(), 'docs', 'review_notes.md');
            let existingContent = '';
            if (fs.existsSync(filePath)) {
              existingContent = fs.readFileSync(filePath, 'utf8');
            } else {
              if (!fs.existsSync('./docs')) fs.mkdirSync('./docs', { recursive: true });
            }

            const finalContent = existingContent + newContent;
            fs.writeFileSync(filePath, finalContent);

      - name: Commit and push review notes to branch
        run: |
          git config user.name "qodo-bot"
          git config user.email "qodo@users.noreply.github.com"
          git add docs/review_notes.md
          git commit -m "📝 Update Qodo review notes"
          git push origin HEAD:${{ github.head_ref }}
