name: Save Qodo Review Comments

on:
  pull_request:
    types: [submitted, edited]

jobs:
  save-comments:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: write

    steps:
      - name: Checkout repository on correct branch
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}

      - name: Fetch PR comments and create file
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const prNumber = context.payload.pull_request.number;
            const { data: comments } = await github.rest.pulls.listReviewComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const qodoComments = comments.filter(c => c.user.login === 'qodo-merge-pro');
            if (qodoComments.length === 0) {
              console.log("No qodo-merge-pro comments found.");
              return;
            }

            let content = `# Qodo Review Comments (PR #${prNumber})\n\n`;

            qodoComments.forEach((c, i) => {
              content += `### 🧠 Comment ${i + 1} (file: ${c.path}, line: ${c.original_line || '-'})\n`;
              content += `> ${c.body}\n\n`;
              content += `🔗 [View in GitHub](${c.html_url})\n\n`;
            });

            if (!fs.existsSync('./.qodo')) fs.mkdirSync('./.qodo');
            fs.writeFileSync('./.qodo/qodo-review.md', content);

      - name: Commit and push Qodo comments to main
        run: |
          git config user.name "qodo-bot"
          git config user.email "qodo@users.noreply.github.com"
          git add .qodo/qodo-review.md
          git commit -m "📝 Add Qodo review comments"
          git push origin HEAD:${{ github.head_ref }}
