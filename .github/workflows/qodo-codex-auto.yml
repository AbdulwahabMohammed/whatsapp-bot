name: Apply Qodo Codex Feedback

on:
  pull_request:
    types: [opened, synchronize]
  pull_request_review_comment:
    types: [created, edited]

jobs:
  apply-feedback:
    runs-on: ubuntu-latest
    concurrency:
      group: codex-auto-${{ github.head_ref }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: ⏱ Wait for Qodo comments
        run: sleep 45

      - name: Check for Qodo review comments
        id: qodo-check
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            let prNumber = context.payload.pull_request?.number;
            if (!prNumber && context.payload.pull_request_review_comment) {
              const url = context.payload.pull_request_review_comment.pull_request_url;
              prNumber = url ? url.split('/').pop() : null;
            }
            if (!prNumber) {
              core.setFailed('Unable to determine PR number');
              return;
            }
            const { data: comments } = await github.rest.pulls.listReviewComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100
            });
            const hasFeedback = comments.some(c => c.user && c.user.login === 'qodo-merge-pro[bot]');
            core.setOutput('has-feedback', hasFeedback);
            if (!hasFeedback) {
              core.notice('No Qodo feedback yet');
            }

      - name: Stop job if no feedback
        if: steps.qodo-check.outputs['has-feedback'] == 'false'
        run: exit 0

      - name: Checkout repository
        if: steps.qodo-check.outputs['has-feedback'] == 'true'
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}

      - name: Fetch Qodo review comments
        if: steps.qodo-check.outputs['has-feedback'] == 'true'
        id: gather
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            let prNumber = context.payload.pull_request?.number;
            if (!prNumber && context.payload.pull_request_review_comment) {
              const url = context.payload.pull_request_review_comment.pull_request_url;
              prNumber = url ? url.split('/').pop() : null;
            }
            if (!prNumber) {
              core.setFailed('Unable to determine PR number');
              return '';
            }
            const { data: comments } = await github.rest.pulls.listReviewComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100
            });
            const feedback = comments
              .filter(c => c.user && c.user.login === 'qodo-merge-pro[bot]')
              .map(c => `🔹 file: ${c.path}\n🧩 line: ${c.original_line}\n💬 comment: ${c.body}\n`)
              .join('\n');
            if (feedback) {
              fs.writeFileSync('README_QODO_FEEDBACK.md', feedback);
            } else {
              console.log('No feedback found');
            }
            return feedback;

      - name: Commit feedback file
        if: steps.gather.outputs.result != ''
        run: |
          git config user.name "qodo-bot"
          git config user.email "qodo@users.noreply.github.com"
          git add README_QODO_FEEDBACK.md
          git diff --staged --quiet || git commit -m "docs: update Qodo feedback"
          git push origin HEAD:${{ github.head_ref }}

      - name: Apply Codex suggestions
        if: steps.gather.outputs.result != ''
        run: |
          if command -v codex >/dev/null 2>&1; then
            codex apply README_QODO_FEEDBACK.md
          else
            echo "Codex command not found"
          fi

      - name: Commit Codex updates
        if: steps.gather.outputs.result != ''
        run: |
          git config user.name "qodo-bot"
          git config user.email "qodo@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: apply Qodo suggestions"
          git push origin HEAD:${{ github.head_ref }}

      - name: Comment success
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            let prNumber = context.payload.pull_request?.number;
            if (!prNumber && context.payload.pull_request_review_comment) {
              const url = context.payload.pull_request_review_comment.pull_request_url;
              prNumber = url ? url.split('/').pop() : null;
            }
            if (!prNumber) {
              core.setFailed('Unable to determine PR number');
              return;
            }
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: '✅ تم تطبيق اقتراحات Qodo Merge Pro تلقائيًا.'
            });

